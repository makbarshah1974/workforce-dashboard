<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Workforce Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    // Apply persisted theme + accent before first paint to avoid a flash.
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light');
        }
        var a = localStorage.getItem('accent');
        if (a) document.documentElement.classList.add('theme-' + a);
      } catch (e) {}
    })();
  </script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 font-sans antialiased">
  <!-- Accent theme picker (top-left) + light/dark toggle (top-right) -->
  <div class="fixed top-4 left-4 z-50 flex items-center gap-2">
    <div class="accent-swatches" role="group" aria-label="Accent color">
      <button type="button" class="accent-swatch" data-accent="indigo" title="Indigo" aria-label="Indigo"></button>
      <button type="button" class="accent-swatch" data-accent="teal" title="Teal" aria-label="Teal"></button>
      <button type="button" class="accent-swatch" data-accent="violet" title="Violet" aria-label="Violet"></button>
    </div>
  </div>

  <!-- Theme toggle: dark is the default (no class); light mode adds `.light`.
       The actual light/dark styling is handled by style.css overrides. -->
  <button id="themeToggleAuth"
          class="fixed top-4 right-4 z-50 p-2 rounded-lg text-slate-300 hover:bg-slate-700 transition-all duration-200 ease-in-out"
          aria-label="Toggle theme">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.72 0l-.7.7M6.34 17.66l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
  </button>

  <!-- The wrapper is scrollable so a tall auth card is never clipped above/below
       the viewport (the classic flex `items-center` overflow bug). -->
  <div class="auth-wrap flex min-h-screen items-center justify-center overflow-y-auto p-4">
    {% block content %}{% endblock %}
  </div>

  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden">
    <div class="rounded-lg px-4 py-3 text-sm font-medium text-white shadow-lg bg-slate-700"></div>
  </div>

  {% block scripts %}{% endblock %}

  <script>
    // Theme toggle — dark is the default (no class); light mode adds `.light`.
    // Mirrors the dashboard's toggle so the choice persists across pages.
    (function () {
      const btn = document.getElementById('themeToggleAuth');
      if (btn) {
        btn.addEventListener('click', function () {
          const root = document.documentElement;
          const isLight = root.classList.toggle('light');
          try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch (e) {}
        });
      }

      // Accent theme picker — applies in both light and dark modes.
      const THEMES = ['indigo', 'teal', 'violet'];
      function setAccent(name) {
        const root = document.documentElement;
        THEMES.forEach(t => root.classList.remove('theme-' + t));
        if (name) root.classList.add('theme-' + name);
        try { localStorage.setItem('accent', name || 'indigo'); } catch (e) {}
        document.querySelectorAll('.accent-swatch').forEach(b => {
          b.classList.toggle('active', b.dataset.accent === name);
        });
      }
      document.querySelectorAll('.accent-swatch').forEach(b => {
        b.addEventListener('click', () => setAccent(b.dataset.accent));
      });
      // Mark the active swatch on load.
      (function () {
        let active = 'indigo';
        THEMES.forEach(t => { if (document.documentElement.classList.contains('theme-' + t)) active = t; });
        document.querySelectorAll('.accent-swatch').forEach(b => {
          b.classList.toggle('active', b.dataset.accent === active);
        });
      })();
    })();
  </script>
</body>
</html>
