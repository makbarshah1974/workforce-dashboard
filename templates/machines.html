{% extends "base.html" %}
{% set active = 'machines' %}
{% block title %}Machines · Monitoring System{% endblock %}
{% block page_title %}Machine Monitoring{% endblock %}

{% block content %}
  <div class="toolbar">
    <div class="filters">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="running">Running</option>
        <option value="out_of_order">Break Down</option>
        <option value="maintenance">Maintenance</option>
        <option value="idle">Idle</option>
      </select>
      <input type="search" id="searchBox" placeholder="Search machine…" />
    </div>
    <div class="summary-pills" id="summaryPills"></div>
  </div>

  <div class="machine-grid" id="machineGrid"></div>

  <!-- Update modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">Update Machine</h3>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Status</label>
          <select id="modalStatus">
            <option value="running">Running</option>
            <option value="out_of_order">Break Down</option>
            <option value="maintenance">Maintenance</option>
            <option value="idle">Idle</option>
          </select>
        </div>
        <div class="field">
          <label>Note</label>
          <textarea id="modalNote" rows="3" placeholder="Optional note (e.g. reason for downtime)"></textarea>
        </div>
        <div class="field">
          <label>Shift</label>
          <select id="modalShift">
            <option value="day">Day</option>
            <option value="night">Night</option>
          </select>
        </div>
        <p class="modal-meta" id="modalMeta"></p>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="modalCancel">Cancel</button>
        <button class="btn" id="modalSave">Save Update</button>
      </div>
    </div>
  </div>

  <!-- Quick start-run modal -->
  <div class="modal-overlay" id="runModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="runModalTitle">Start Run</h3>
        <button class="modal-close" id="runModalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Item Name</label>
          <input id="runItemName" placeholder="e.g. Bearing Assy" autocomplete="off" />
        </div>
        <div class="field">
          <label>Item Code</label>
          <input id="runItemCode" placeholder="e.g. BRG-001" autocomplete="off" />
        </div>
        <div class="field">
          <label>Note</label>
          <textarea id="runNote" rows="2" placeholder="Optional note"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="runModalCancel">Cancel</button>
        <button class="btn" id="runModalStart">▶ Start Run</button>
      </div>
    </div>
  </div>

  <!-- Shift-hours edit modal -->
  <div class="modal-overlay" id="shModalOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="shModalTitle">Edit Shift Hours</h3>
        <button class="modal-close" id="shModalClose">×</button>
      </div>
      <div class="modal-body">
        <p class="modal-meta" id="shModalMeta"></p>
        <div class="field">
          <label>Day Shift Planned Hours</label>
          <input id="shDayHours" type="number" min="0" max="24" step="1" />
        </div>
        <div class="field">
          <label>Night Shift Planned Hours</label>
          <input id="shNightHours" type="number" min="0" max="24" step="1" />
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn secondary" id="shModalCancel">Cancel</button>
        <button class="btn" id="shModalSave">Save Hours</button>
      </div>
    </div>
  </div>

{% endblock %}

{% block scripts %}
<script>
  const STATUS_META = {
    running:      { label: 'Running',      color: '#34d399' },
    out_of_order: { label: 'Break Down', color: '#f87171' },
    maintenance:  { label: 'Maintenance',  color: '#fbbf24' },
    idle:         { label: 'Idle',         color: '#94a3b8' },
  };

  // Whether the current user may create/update entries (start/stop runs,
  // change machine status, edit shift hours). Set from the server so the
  // controls above are simply not rendered for roles without entry access.
  const canEntry = {{ 'true' if user_can('entry') else 'false' }};

  let machines = [];
  let currentId = null;
  let runningIds = new Set();
  let runByMachine = new Map();  // machine_id -> active run id

  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function fmtDuration(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));
    const d = Math.floor(seconds / 86400);
    const h = Math.floor((seconds % 86400) / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    const pad = (n) => String(n).padStart(2, '0');
    return d ? `${d}d ${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function esc(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function statusElapsed(iso) {
    if (!iso) return '00:00:00';
    const start = Date.parse(iso);
    return start ? fmtDuration((Date.now() - start) / 1000) : '00:00:00';
  }

  async function loadMachines() {
    try{ if(typeof _machAbort!=='undefined' && _machAbort) _machAbort.abort(); }catch(e){}
    if(typeof _machAbort!=='undefined') _machAbort=new AbortController();
    const sig = (typeof _machAbort!=='undefined' && _machAbort) ? _machAbort.signal : undefined;
    const [mRes, rRes] = await Promise.all([
      fetch('/api/machines?' + filterQuery(), {cache:'no-store', signal: sig}),
      fetch('/api/runs?status=running&' + filterQuery(), {cache:'no-store', signal: sig}),
    ]);
    const mData = await mRes.json();
    const rData = await rRes.json();
    machines = mData.machines;
    runningIds = new Set((rData.runs || []).map(r => r.machine_id));
    runByMachine = new Map((rData.runs || []).map(r => [r.machine_id, r.id]));
    render();
  }

  function render() {
    const filter = $('statusFilter').value;
    const q = $('searchBox').value.trim().toLowerCase();
    const list = machines.filter(m =>
      (!filter || m.status === filter) &&
      (!q || m.name.toLowerCase().includes(q) || (m.code || '').toLowerCase().includes(q))
    );

    // Summary pills
    const counts = { running: 0, out_of_order: 0, maintenance: 0, idle: 0 };
    machines.forEach(m => counts[m.status] = (counts[m.status] || 0) + 1);
    $('summaryPills').innerHTML = Object.entries(counts).map(([s, c]) =>
      `<span class="pill ${s}"><span class="pill-dot" style="background:${STATUS_META[s].color}"></span>${STATUS_META[s].label}: <b>${c}</b></span>`
    ).join('');

    $('machineGrid').innerHTML = list.length
      ? list.map(m => {
          const isRunning = runningIds.has(m.id);
          const showNotes = !isRunning && m.notes && (m.status === 'idle' || m.status === 'maintenance' || m.status === 'out_of_order');
          return `
        <div class="machine-card status-${m.status}">
          <div class="mc-top">
            <div>
              <div class="mc-name">${m.name}</div>
              <div class="mc-code">${m.code || ''} · ${m.location || '—'}</div>
            </div>
            <span class="badge ${m.status}">${STATUS_META[m.status]?.label || m.status}</span>
          </div>
          <div class="mc-meta">
            <span>Group: <b>${m.group_name || '—'}</b></span>
            <span>Product: <b>${m.product_name || '—'}</b></span>
          </div>
          <div class="mc-shift-hours">
            <span class="sh-chip" title="Planned day-shift hours">☀ Day <b>${m.day_hours ?? 11}h</b></span>
            <span class="sh-chip" title="Planned night-shift hours">🌙 Night <b>${m.night_hours ?? 11}h</b></span>
          </div>
          ${showNotes ? `<div class="mc-notes">${esc(m.notes)}</div>` : ''}
          <div class="mc-run">
            <span class="mc-st-label">${STATUS_META[m.status]?.label || m.status}</span>
            <span class="run-timer st-${m.status}" data-start="${m.status_since || ''}">${statusElapsed(m.status_since)}</span>
          </div>
          <div class="mc-foot">
            <span class="mc-updated">${m.updated_by || '—'} · ${fmtTime(m.updated_at)}</span>
            <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
              ${canEntry ? (isRunning
                ? `<button class="btn small run-stop" data-id="${runByMachine.get(m.id)}">■ Stop</button>`
                : `<button class="btn small run-start" data-id="${m.id}">▶ Start</button>`) : ''}
              ${canEntry ? `<button class="btn small" data-id="${m.id}">Update</button>` : ''}
              ${canEntry ? `<button class="btn small sh-edit" data-id="${m.id}">Edit Hours</button>` : ''}
            </div>
          </div>
        </div>`;
        }).join('')
      : '<div class="empty">No machines match.</div>';

    document.querySelectorAll('.machine-card .btn.small:not(.run-start):not(.run-stop):not(.sh-edit)').forEach(btn =>
      btn.addEventListener('click', () => openModal(parseInt(btn.dataset.id, 10))));
    document.querySelectorAll('.machine-card .run-start').forEach(btn =>
      btn.addEventListener('click', (e) => { e.stopPropagation(); openRunModal(parseInt(btn.dataset.id, 10)); }));
    document.querySelectorAll('.machine-card .run-stop').forEach(btn =>
      btn.addEventListener('click', (e) => { e.stopPropagation(); stopRun(parseInt(btn.dataset.id, 10)); }));
  }

  function openModal(id) {
    const m = machines.find(x => x.id === id);
    if (!m) return;
    currentId = id;
    $('modalTitle').textContent = 'Update · ' + m.name;
    $('modalStatus').value = m.status;
    $('modalNote').value = m.notes || '';
    // Default the shift to the global filter selection (if any).
    $('modalShift').value = (window.__wfFilter && window.__wfFilter.shift) || 'day';
    $('modalMeta').textContent = `Group: ${m.group_name || '—'} · Product: ${m.product_name || '—'}`;
    $('modalOverlay').classList.add('show');
  }
  function closeModal() { $('modalOverlay').classList.remove('show'); currentId = null; }

  // ---- Quick start-run modal ----
  let runId = null;
  async function openRunModal(id) {
    const m = machines.find(x => x.id === id);
    if (!m) return;
    runId = id;
    $('runModalTitle').textContent = 'Start Run · ' + m.name;
    $('runItemName').value = '';
    $('runItemCode').value = '';
    $('runNote').value = '';
    $('runModalOverlay').classList.add('show');
  }
  function closeRunModal() { $('runModalOverlay').classList.remove('show'); runId = null; }
  async function startRunFromModal() {
    if (runId == null) return;
    const payload = {
      machine_id: runId,
      item_name: $('runItemName').value.trim(),
      item_code: $('runItemCode').value.trim(),
      note: $('runNote').value.trim(),
    };
    const res = await fetch('/api/run/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
    });
    if (res.ok) { showToast('Run started'); broadcastMachineChange(); closeRunModal(); loadMachines(); }
    else showToast('Failed to start');
  }

  async function stopRun(id) {
    const res = await fetch('/api/run/stop/' + id, { method: 'POST' });
    if (res.ok) { showToast('Run stopped'); broadcastMachineChange(); loadMachines(); }
    else showToast('Failed to stop');
  }

  async function saveUpdate() {
    if (currentId == null) return;
    const payload = {
      status: $('modalStatus').value,
      note: $('modalNote').value,
      shift: $('modalShift').value
    };
    const res = await fetch('/api/machine/' + currentId + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      showToast('Machine updated');
      closeModal();
      broadcastMachineChange();
      loadMachines();
    } else {
      showToast('Update failed');
    }
  }

  const $ = (id) => document.getElementById(id);
  let _searchDebounce=null;
  let _machAbort=null;
  const _origFetch = window.fetch;
  // debounce search: 300ms before re-render + API refetch via loadMachines
  $('statusFilter').addEventListener('change', render);
  $('searchBox').addEventListener('input', () => { clearTimeout(_searchDebounce); _searchDebounce=setTimeout(render, 250); });
  $('modalClose').addEventListener('click', closeModal);
  $('modalCancel').addEventListener('click', closeModal);
  $('modalSave').addEventListener('click', saveUpdate);
  $('modalOverlay').addEventListener('click', (e) => { if (e.target === $('modalOverlay')) closeModal(); });
  $('runModalClose').addEventListener('click', closeRunModal);
  $('runModalCancel').addEventListener('click', closeRunModal);
  $('runModalStart').addEventListener('click', startRunFromModal);
  $('runModalOverlay').addEventListener('click', (e) => { if (e.target === $('runModalOverlay')) closeRunModal(); });

  // ---- Shift-hours edit modal ----
  let shId = null;
  function openShModal(id) {
    const m = machines.find(x => x.id === id);
    if (!m) return;
    shId = id;
    $('shModalTitle').textContent = 'Edit Shift Hours · ' + m.name;
    $('shModalMeta').textContent = `Group: ${m.group_name || '—'} · Product: ${m.product_name || '—'}`;
    $('shDayHours').value = (m.day_hours ?? 11);
    $('shNightHours').value = (m.night_hours ?? 11);
    $('shModalOverlay').classList.add('show');
  }
  function closeShModal() { $('shModalOverlay').classList.remove('show'); shId = null; }
  async function saveShHours() {
    if (shId == null) return;
    const payload = {
      day_hours: parseInt($('shDayHours').value, 10) || 0,
      night_hours: parseInt($('shNightHours').value, 10) || 0,
    };
    const res = await fetch('/api/machine/' + shId + '/shift-hours', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (res.ok) {
      showToast('Shift hours saved');
      closeShModal();
      loadMachines();
    } else {
      const err = await res.json().catch(() => ({}));
      showToast(err.error || 'Failed to save');
    }
  }
  $('shModalClose').addEventListener('click', closeShModal);
  $('shModalCancel').addEventListener('click', closeShModal);
  $('shModalSave').addEventListener('click', saveShHours);
  $('shModalOverlay').addEventListener('click', (e) => { if (e.target === $('shModalOverlay')) closeShModal(); });
  // Delegate the "Edit Hours" buttons rendered inside cards.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.sh-edit');
    if (btn) { e.stopPropagation(); openShModal(parseInt(btn.dataset.id, 10)); }
  });


  // Live ticking timers for the current status of every machine
  function tickTimers() {
    document.querySelectorAll('.run-timer[data-start]').forEach(el => {
      const start = Date.parse(el.dataset.start);
      el.textContent = start ? fmtDuration((Date.now() - start) / 1000) : '00:00:00';
    });
  }

  // 3s poll — skip if user typing in toolbar or a modal is open or tab hidden
  function _machShouldPoll(){ if(document.hidden) return false; if(document.querySelector('.modal-overlay.show')) return false; const a=document.activeElement; if(a && a.closest && a.closest('.toolbar, input, select')) return false; return true; }
  let _machTimer=setInterval(()=>{ if(_machShouldPoll()) loadMachines(); },3000);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ clearInterval(_machTimer); _machTimer=null; } else if(!_machTimer) _machTimer=setInterval(()=>{ if(_machShouldPoll()) loadMachines(); },3000); });

  loadMachines();
  setInterval(tickTimers, 1000);

  // Live cross-tab sync: reload when another tab changes machine status.
  window.addEventListener('wf:machines-changed', () => loadMachines());

  // Global date + shift filter: re-fetch machines + running runs on change.
  window.addEventListener('wf:filter-changed', () => loadMachines());
</script>
{% endblock %}
