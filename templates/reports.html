{% extends "base.html" %}
{% set active = 'reports' %}
{% block title %}Reports · Monitoring System{% endblock %}
{% block page_title %}Reports{% endblock %}

{% block content %}
  <div class="toolbar">
    <div class="filters">
      <label class="inline">From <input type="date" id="fromDate" /></label>
      <label class="inline">To <input type="date" id="toDate" /></label>
      <select id="machineFilter">
        <option value="">All machines</option>
      </select>
      <select id="shiftFilter">
        <option value="">All shifts</option>
        <option value="day">Day</option>
        <option value="night">Night</option>
      </select>
      <select id="statusFilter">
        <option value="">All transitions</option>
        <option value="running">Running</option>
        <option value="out_of_order">Break Down</option>
        <option value="maintenance">Maintenance</option>
        <option value="idle">Idle</option>
      </select>
      <input type="search" id="searchBox" placeholder="Search machine / note…" />
      <button class="btn" id="applyBtn">Apply</button>
      <button class="btn secondary" id="exportBtn">Export CSV</button>
    </div>
  </div>

  <div class="grid grid-4" id="reportKpis"></div>

  <div class="section-title">Status Change Log</div>
  <div class="table-wrap">
    <table id="reportTable">
      <thead>
        <tr><th>Time</th><th>Machine</th><th>Product</th><th>From</th><th>To</th><th>Shift</th><th>Duration</th><th>By</th><th>Note</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
{% endblock %}

{% block scripts %}
<script>
  const STATUS_META = {
    running:      { label: 'Running',     cls: 'running' },
    out_of_order: { label: 'Break Down', cls: 'out_of_order' },
    maintenance:  { label: 'Maintenance', cls: 'maintenance' },
    idle:         { label: 'Idle',        cls: 'idle' },
  };
  function fmtTime(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    const pad = (n) => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    const pad = (n) => String(n).padStart(2, '0');
    if (h) return `${h}h ${pad(m)}m`;
    if (m) return `${m}m ${pad(s)}s`;
    return `${s}s`;
  }
  let committedParams = '';
  let _repAbort=null;
  function params() {
    const p = new URLSearchParams();
    const from = $('fromDate').value;
    const to = $('toDate').value;
    if (from) p.set('date_from', from);
    if (to) p.set('date_to', to);
    const mid = $('machineFilter').value;
    if (mid) p.set('machine_id', mid);
    const sh = $('shiftFilter').value;
    if (sh) p.set('shift', sh);
    const s = $('statusFilter').value;
    if (s) p.set('status', s);
    const q = $('searchBox').value.trim();
    if (q) p.set('search', q);
    return p.toString();
  }
  function committedQuery(){ return committedParams || params(); }
  function snapshotReports(){ committedParams = params(); }
  async function loadReports() {
    try{ if(_repAbort) _repAbort.abort(); }catch(e){}
    _repAbort=new AbortController();
    let res; try{ res = await fetch('/api/reports?' + committedQuery(), {cache:'no-store', signal:_repAbort.signal}); }catch(e){ if(e.name==='AbortError') return; throw e; }
    const data = await res.json();
    const events = data.events || [];

    const summary = data.summary || {};
    const statusTotals = data.status_totals || {};
    const totalRows = Object.entries(statusTotals)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);
    const kpis = [
      { label: 'Total Changes', value: data.count || 0, cls: 'accent' },
      ...totalRows.map(([k, v], i) => ({
        label: (STATUS_META[k]?.label || k) + ' Time',
        value: fmtDur(v),
        cls: ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'][i % 6]
      })),
    ];
    $('reportKpis').innerHTML = kpis.map(k =>
      `<div class="card ${k.cls}"><div class="label">${k.label}</div><div class="value">${k.value}</div></div>`
    ).join('');

    $('reportTable').querySelector('tbody').innerHTML = events.length
      ? events.map(l => `
        <tr>
          <td>${fmtTime(l.timestamp)}</td>
          <td class="strong">${l.machine_name || '—'}${l.machine_code ? ' · ' + l.machine_code : ''}</td>
          <td>${l.product_name || '—'}</td>
          <td><span class="badge ${l.from_status || ''}">${STATUS_META[l.from_status]?.label || l.from_status || '—'}</span></td>
          <td><span class="badge ${l.to_status}">${STATUS_META[l.to_status]?.label || l.to_status}</span></td>
          <td>${l.shift ? (l.shift.charAt(0).toUpperCase() + l.shift.slice(1)) : '—'}</td>
          <td>${l.duration_seconds != null ? fmtDur(l.duration_seconds) : '—'}</td>
          <td>${l.updated_by || '—'}</td>
          <td>${l.note || '—'}</td>
        </tr>`).join('')
      : '<tr><td colspan="9" class="empty">No records in range.</td></tr>';
  }
  const $ = (id) => document.getElementById(id);

  // Populate the machine dropdown from the API.
  async function loadMachines() {
    try {
      const res = await fetch('/api/machines');
      const data = await res.json();
      const sel = $('machineFilter');
      (data.machines || []).forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.name + (m.code ? ' · ' + m.code : '');
        sel.appendChild(opt);
      });
    } catch (e) { /* non-fatal */ }
  }

  let _searchTimer=null;
  $('applyBtn').addEventListener('click', () => { snapshotReports(); loadReports(); });
  $('statusFilter').addEventListener('change', () => { snapshotReports(); loadReports(); });
  $('shiftFilter').addEventListener('change', () => { snapshotReports(); loadReports(); });
  $('machineFilter').addEventListener('change', () => { snapshotReports(); loadReports(); });
  $('searchBox').addEventListener('input', () => { clearTimeout(_searchTimer); _searchTimer=setTimeout(()=>{ snapshotReports(); loadReports(); }, 300); });
  $('exportBtn').addEventListener('click', () => {
    window.location.href = '/api/reports/export?' + committedQuery();
  });

  // 3s committed poll — skip if filter focused or tab hidden
  function _repShouldPoll(){ if(document.hidden) return false; const a=document.activeElement; if(a && a.closest && a.closest('.toolbar, input, select')) return false; return true; }
  let _repTimer=null;
  function startRepPoll(){ if(_repTimer) clearInterval(_repTimer); _repTimer=setInterval(()=>{ if(_repShouldPoll()) loadReports(); },3000); }
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ clearInterval(_repTimer); _repTimer=null; } else if(!_repTimer) startRepPoll(); });

  loadMachines();
  snapshotReports(); loadReports(); startRepPoll();
  window.addEventListener('wf:machines-changed', ()=>{ if(_repShouldPoll()) loadReports(); });
</script>
{% endblock %}
